version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Mongo is intentionally NOT exposed to the host — the app connects via the
    # internal Docker network. To inspect with MongoDB Compass add:
    #   ports: ["27018:27017"]   (use a non-conflicting host port)
    volumes:
      - mongo_data:/data/db
    # replica set enabled — initiate once after first boot (see README)
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data2:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot init container — runs rs.initiate() then exits. Safe to re-run.
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
      mongo2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 --eval '
          try {
            rs.status();
            print("Replica set already initialised — skipping.");
          } catch(e) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo:27017",  priority: 2 },
                { _id: 1, host: "mongo2:27017", priority: 1 }
              ]
            });
            print("Replica set initialised.");
          }
        '

  # Dumps with --oplog every 6 hours, compresses, rotates, then rsyncs off-server
  mongo-backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - mongo_backups:/backups
      - ./scripts/mongo_backup.sh:/usr/local/bin/mongo_backup.sh:ro
      - ./scripts/rclone.conf:/config/rclone/rclone.conf:ro # populated by setup_rclone.sh
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
      RCLONE_REMOTE: "${RCLONE_REMOTE:-}" # e.g. "s3:my-bucket/miniventory" — leave blank to skip
      HEALTHCHECK_UUID: "${HEALTHCHECK_UUID:-}" # hc-ping.com UUID — leave blank to skip
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache mongodb-tools bash curl > /dev/null 2>&1
        chmod +x /usr/local/bin/mongo_backup.sh
        /usr/local/bin/mongo_backup.sh
        while true; do
          sleep 21600
          /usr/local/bin/mongo_backup.sh
        done

  app:
    build: .
    image: docker.io/YOUR_DOCKERHUB_USERNAME/miniventory:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URI: "mongodb://mongo:27017,mongo2:27017/?replicaSet=rs0"
      APP_PORT: "2152"
    ports:
      - "2152:2152"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2152/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  mongo_data: # primary node data
  mongo_data2: # secondary node data (replica)
  mongo_backups: # compressed oplog-capable dumps — persists across container removal
